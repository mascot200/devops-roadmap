<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="t d">
  <title id="t">Instructor portrait placeholder</title>
  <desc id="d">A circular placeholder with the initials UE. Replace with the instructor's photo.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#0b3d91"/>
    </linearGradient>
  </defs>
  <circle cx="160" cy="160" r="156" fill="url(#g)"/>
  <circle cx="160" cy="160" r="156" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
  <text x="160" y="160" text-anchor="middle" dominant-baseline="central"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="116" font-weight="600" fill="#ffffff">UE</text>
</svg>
